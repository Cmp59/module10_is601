name: CI/CD

on:
 push:
   branches: [ main ]
 pull_request:
   branches: [ main ]

jobs:
 test:
   runs-on: ubuntu-latest
   services:
     postgres:
       image: postgres:17
       env:
         POSTGRES_USER: postgres
         POSTGRES_PASSWORD: postgres
         POSTGRES_DB: fastapi_test
       ports:
         - 5432:5432
       options: >-
         --health-cmd "pg_isready -U postgres -d fastapi_test"
         --health-interval 5s
         --health-timeout 5s
         --health-retries 10
   env:
     TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/fastapi_test
   steps:
     - uses: actions/checkout@v4
     - uses: actions/setup-python@v5
       with:
         python-version: '3.11'
         cache: pip

     - name: Install dependencies
       run: |
         python -m pip install -r requirements.txt
         python -m playwright install --with-deps chromium

     - name: Run tests
       run: python -m pytest tests/unit/ tests/integration/ tests/e2e/ --junitxml=test-results/junit.xml

 security:
   needs: test
   runs-on: ubuntu-latest
   steps:
     - uses: actions/checkout@v4
     
     - name: Build image
       run: docker build -t app:test .
     
     - name: Run Trivy vulnerability scanner
       uses: aquasecurity/trivy-action@master
       with:
         image-ref: 'app:test'
         format: 'table'
         exit-code: '1'
         ignore-unfixed: true
         severity: 'CRITICAL,HIGH'

 deploy:
   needs: security
   if: github.event_name == 'push' && github.ref == 'refs/heads/main'
   runs-on: ubuntu-latest
   permissions:
     contents: read
   steps:
     - uses: actions/checkout@v4
     
     - uses: docker/setup-buildx-action@v3

     - name: Log in to Docker Hub
       uses: docker/login-action@v3
       with:
         username: ${{ secrets.DOCKERHUB_USERNAME }}
         password: ${{ secrets.DOCKERHUB_TOKEN }}
         
     - name: Build and push to Docker Hub
       uses: docker/build-push-action@v5
       with:
         push: true
         tags: |
           cmp59/module10-is601:latest
           cmp59/module10-is601:${{ github.sha }}
         platforms: linux/amd64,linux/arm64
